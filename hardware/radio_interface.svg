<text x="56" y="924" font-size="12" text-anchor="start" fill="#333" font-weight="normal">• Parts: U1 LM393 (one half used; tie unused inputs +3V3/GND), Q1 2N7000, RV1 10k trimpot, resistors 1/4 W 5% (20k = two 10k in series is fine).</text>
<text x="56" y="942" font-size="12" text-anchor="start" fill="#333" font-weight="normal">• RX: C1/R1 couple the audio onto VREF; R3 adds ~30 mV hysteresis so noise between tones does not chatter. Feed 0.2-2 Vpp; set radio volume to mid.</text>
<text x="56" y="960" font-size="12" text-anchor="start" fill="#333" font-weight="normal">• TX: the CPU steps PA0-PA3 through a 16-step sine at a fixed rate; R7/C3 (3.4 kHz) smooths the steps; C4 blocks DC; RV1 sets deviation.</text>
<text x="56" y="978" font-size="12" text-anchor="start" fill="#333" font-weight="normal">• PTT: VIA pins are inputs after reset, so R9 holds Q1 off and the radio stays unkeyed. Firmware also limits key-down time.</text>
<text x="56" y="996" font-size="12" text-anchor="start" fill="#333" font-weight="normal">• HTs with a Kenwood 2-pin jack key PTT through the mic line: wire Q1 drain to MIC via 2.2k instead. Check your radio manual before connecting.</text>
<text x="56" y="1014" font-size="12" text-anchor="start" fill="#333" font-weight="normal">• All grounds common: radio GND to J4 pin 49. Nothing on J4 may see more than 3.3 V.</text>
</svg>